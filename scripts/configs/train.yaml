defaults:
  - cohort: mass_f1
  - model: logistic
  - _self_
  - override hydra/job_logging: stdout

seed: 42
n_jobs: -1
results_dir: results

cv:
  regression:
    _target_: sklearn.model_selection.KFold
    n_splits: 5
    shuffle: true
    random_state: ${seed}
  classification:
    _target_: sklearn.model_selection.StratifiedKFold
    n_splits: 5
    shuffle: true
    random_state: ${seed}

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
