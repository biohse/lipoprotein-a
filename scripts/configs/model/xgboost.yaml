defaults:
  - /preprocessing@_global_.preprocessing: raw
  - _self_

name: xgboost
task: classification
estimator:
  _target_: lpa.models.xgboost.XGBClassifier
  random_state: ${seed}
  n_jobs: 1
param_grid:
  model__max_depth: [2, 3, 5, 10]
  model__learning_rate: [0.01, 0.1]
  model__n_estimators: [100, 200, 500]
  model__scale_pos_weight: [1.0, balanced]
