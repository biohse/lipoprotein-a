defaults:
  - /preprocessing@_global_.preprocessing: raw
  - _self_

name: rf_regressor
task: regression
standardize_target: false
target_transforms: [identity, log1p]
estimator:
  _target_: sklearn.ensemble.RandomForestRegressor
  random_state: ${seed}
  n_jobs: 1
param_grid:
  regressor__model__n_estimators: [50, 100, 500, 1000]
  regressor__model__max_features: [1, 5, 1.0]
